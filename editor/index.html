<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlit 🌗 Desk · 编辑器</title><link rel="stylesheet" href="/style.css"><script defer src="/ui-strings.js"></script><script defer src="/autosave.js"></script><script defer src="/i18n.js"></script><script defer src="/editor-moon.js"></script><script defer src="/vendor/purify.js"></script><script defer src="/vendor/turndown.js"></script><script defer src="/vendor/gfm.js"></script><script defer src="/rich-editor.js"></script><script defer src="/app.js"></script><script defer src="/settings-ui.js"></script><script defer src="/polish-ui.js"></script></head>
<body>
<aside>
  <header><a class="brand" id="blog-link" href="http://127.0.0.1:4000/" target="_blank" rel="noopener" aria-label="打开本地博客">Moonlit <span data-editor-moon aria-hidden="true">🌗</span> Desk</a><span id="site-name">文章编辑器</span></header>
  <button id="new" class="primary">新建文章</button><button id="settings-button">设置</button>
  <input id="filter" type="search" placeholder="搜索文章与草稿" aria-label="搜索文章与草稿">
  <nav id="articles" aria-label="文章列表"></nav>
</aside>
<main>
  <header class="topbar"><div><h1 id="heading">开始写作</h1><p id="file-path">选择一篇文章，或新建一篇</p></div><div class="publish-actions"><button id="publish" disabled>发布到 GitHub</button><button id="save" class="primary" disabled hidden>保存文章 <kbd>⌘S</kbd></button></div></header>
  <details id="article-properties">
    <summary>文章属性 · 标题、标签、分类与关键词</summary>
    <fieldset id="metadata-fields" disabled>
      <label>文章标题<input id="meta-title"></label>
      <label>第二语言标题<input id="meta-title-zh"></label>
      <label>日期<input id="meta-date" type="date"></label>
      <label>关键词<input id="meta-keywords" list="keyword-options" placeholder="多个关键词用逗号分隔"></label>
      <div><label>标签<select id="meta-tags" multiple size="3"></select></label><button type="button" data-add-meta="tags">添加标签</button></div>
      <div><label>分类／归档分组<select id="meta-categories" multiple size="3"></select></label><button type="button" data-add-meta="categories">添加分类</button></div>
      <datalist id="keyword-options"></datalist>
    </fieldset>
  </details>
  <div class="toolbar" role="toolbar" aria-label="常用编辑工具">
    <button data-command="undo" data-rich-only title="撤销 ⌘Z">撤销</button><button data-command="redo" data-rich-only title="重做 ⇧⌘Z">重做</button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <select id="block-format" data-rich-only aria-label="段落样式"><option value="p">正文</option><option value="h1">标题 1</option><option value="h2">标题 2</option><option value="h3">标题 3</option><option value="h4">标题 4</option><option value="blockquote">引用</option></select>
    <button data-wrap="**" data-command="bold" aria-pressed="false" title="加粗 ⌘B"><strong>粗体</strong></button>
    <button data-wrap="*" data-command="italic" aria-pressed="false" title="斜体 ⌘I"><em>斜体</em></button>
    <button data-command="underline" data-rich-only aria-pressed="false" title="下划线 ⌘U"><u>下划线</u></button>
    <button data-command="insertUnorderedList" data-rich-only aria-pressed="false">无序列表</button><button data-command="insertOrderedList" data-rich-only aria-pressed="false">有序列表</button>
    <button id="insert-link">链接</button><button id="insert-image">图片</button>
    <input id="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
    <button id="advanced-button" aria-expanded="false" aria-controls="advanced-tools">高级 ▾</button>
    <button id="md-button" aria-pressed="false">MD 编辑器</button>
    <button id="polish-button" title="用本地 AI 把大白话润成你的文风">✒︎ 润笔</button>
  </div>
  <div id="advanced-tools" class="toolbar advanced-toolbar" role="toolbar" aria-label="高级编辑工具" hidden>
    <button data-wrap="~~" data-command="strikeThrough" aria-pressed="false">删除线</button>
    <button data-command="subscript" data-rich-only aria-pressed="false">下标</button><button data-command="superscript" data-rich-only aria-pressed="false">上标</button>
    <button id="inline-code" data-rich-only>行内代码</button><button id="code-block" data-rich-only>代码块</button>
    <button id="insert-table" data-rich-only>插入表格</button><button id="table-row" data-rich-only>表格加行</button><button id="remove-table" data-rich-only>移除表格</button>
    <button data-command="insertHorizontalRule" data-rich-only>分隔线</button>
    <button data-command="indent" data-rich-only>增加缩进</button><button data-command="outdent" data-rich-only>减少缩进</button>
    <button data-command="unlink" data-rich-only>取消链接</button><button data-command="removeFormat" data-rich-only>清除格式</button>
    <button id="insert-fold">折叠内容</button>
    <span class="hint">图片支持粘贴、拖入；格式会随文章保存</span>
  </div>
  <div id="workspace" class="workspace rich-mode">
    <section id="rich-pane" aria-label="富文本编辑区">
      <article class="writing-paper">
        <h2 id="paper-title">开始写作</h2>
        <div id="rich-body" role="textbox" aria-label="文章正文" aria-multiline="true" aria-disabled="true" contenteditable="false" data-placeholder="在这里写下你的文章…"></div>
      </article>
    </section>
    <section id="source-pane" class="source-pane" aria-label="Markdown 编辑区" hidden><textarea id="source" spellcheck="false" aria-label="文章 Markdown 源码" placeholder="在这里编辑 Markdown 和顶部配置。" disabled></textarea></section>
  </div>
  <footer><span id="status" role="status" aria-live="polite">正在连接…</span><span id="word-count"></span></footer>
</main>
<dialog id="new-dialog">
<form id="new-form">
<h2>新建文章</h2>
<p class="hint-text">英文标题、中文标题和文件名，填写任意一项即可。</p>
<p id="new-error" role="alert" hidden></p>
<label>英文标题<input name="title" maxlength="180" placeholder="A new beginning"></label>
<label>中文标题<input name="chinese" maxlength="180" placeholder="新的开始"></label>
<label>文件名<input name="slug" maxlength="120" pattern="[A-Za-z0-9_-]+" placeholder="根据标题自动生成"><small id="slug-hint">留空自动生成，中文标题使用拼音和下划线</small></label>
<label>保存位置<select name="zone"><option value="_drafts">草稿</option><option value="_posts">文章</option></select></label>

<div class="dialog-actions"><button type="button" id="cancel-new">取消</button><button type="submit" class="primary">开始写作</button></div>
</form>
</dialog>
<dialog id="polish-dialog" class="polish-dialog">
<form id="polish-form" method="dialog">
<h2>润笔</h2>
<p class="hint-text" id="polish-scope"></p>
<div class="polish-options"><label>方式<select id="polish-mode"><option value="light">轻度修饰</option><option value="full" selected>成文</option><option value="expand">扩写</option></select></label><label class="polish-grow">额外要求<input id="polish-instruction" maxlength="500" placeholder="可选，例如：语气轻松一些"></label></div>
<div class="polish-columns"><label>原文（可修改）<textarea id="polish-input" rows="14" spellcheck="false"></textarea></label><label>润色结果（可修改）<textarea id="polish-output" rows="14" spellcheck="false"></textarea></label></div>
<ul id="polish-issues" class="polish-issues" role="alert" hidden></ul>
<details id="polish-references" class="polish-references" hidden><summary id="polish-reference-summary"></summary><ol id="polish-reference-list"></ol></details>
<p id="polish-status" class="polish-status" role="status" aria-live="polite"></p>
<div class="dialog-actions"><button type="button" id="polish-cancel">关闭</button><button type="button" id="polish-stop" hidden>停止</button><button type="button" id="polish-run">开始润笔</button><button type="button" id="polish-accept" class="primary" disabled>替换原文</button></div>
</form>
</dialog>
</body></html>
